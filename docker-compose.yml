services:
  postgres:
    image: postgres:16
    container_name: funpay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: funpay
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Clone_FunPay
    ports:
      - "5435:5432"
    volumes:
      - funpay_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d funpay"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  funpay_postgres_data:
